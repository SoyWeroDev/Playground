services:
  # ─────────────────────────────────────────────
  # App - PHP 8.3 + Apache + React
  # ─────────────────────────────────────────────
  app:
    build: .
    container_name: acordeon-app
    ports:
      - "8000:80"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=acordeon
      - DB_USERNAME=root
      - DB_PASSWORD=root
    networks:
      - acordeon-net
    depends_on:
      - db

  # ─────────────────────────────────────────────
  # DB - MySQL
  # ─────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: acordeon-db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=acordeon
    ports:
      - "3306:3306"
    networks:
      - acordeon-net

networks:
  acordeon-net:
    driver: bridge
